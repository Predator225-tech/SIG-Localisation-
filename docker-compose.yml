services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sig_madagascar_db
    environment:
      POSTGRES_DB: ${DB_NAME:-sig_madagascar}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copiez .env.example vers .env et renseignez DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
volumes:
  pgdata:
